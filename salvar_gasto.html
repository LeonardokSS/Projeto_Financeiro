<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Gasto</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d4d0d 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #10b981;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1a1a1a;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #10b981;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .btn-voltar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-voltar:hover {
            background: #555;
        }

        #msg {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<a href="/index.html" class="btn-voltar">Voltar</a>

<div class="container">
    <h1>➕ Novo Gasto</h1>

    <form id="formGasto">
        <label>Nome do gasto</label>
        <input type="text" name="nome" required placeholder="Ex: Almoço, Internet, Uber">

        <label>Categoria</label>
        <select name="categoria" required>
            <option value="">Selecione</option>
            <option value="Alimentação">Periféricos</option>
            <option value="Alimentação">Investimento</option>
            <option value="Alimentação">Fixo</option>
            <option value="Alimentação">Alimentação</option>
            <option value="Transporte">Transporte</option>
            <option value="Lazer">Lazer</option>
            <option value="Moradia">Moradia</option>
            <option value="Educação">Educação</option>
            <option value="Saúde">Saúde</option>
            <option value="Outros">Outros</option>
        </select>

        <label>Data do gasto</label>
        <input type="date" name="data" required>

        <label>Valor (R$)</label>
        <input type="number" name="valor" step="0.01" required placeholder="0,00">

        <button type="submit">Salvar gasto</button>
    </form>

    <p id="msg"></p>
</div>

<script>
    const form = document.getElementById('formGasto');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', e => {
        e.preventDefault();

        const dados = Object.fromEntries(new FormData(form));

        fetch('/salvar-gasto', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dados)
        })
        .then(r => r.json())
        .then(() => {
            msg.style.color = '#059669';
            msg.textContent = 'Gasto salvo com sucesso';
            form.reset();
        })
        .catch(() => {
            msg.style.color = '#dc2626';
            msg.textContent = 'Erro ao salvar gasto';
        });
    });
</script>

</body>
</html>
