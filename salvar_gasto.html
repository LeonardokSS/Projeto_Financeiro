<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d4d0d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            border: 2px solid #10b981;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-weight: 600;
            color: #1a1a1a;
            font-size: 14px;
            margin-bottom: -15px;
        }

        input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #10b981;
        }

        button {
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        #msg.show {
            display: block;
        }

        #msg.success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        #msg.error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }
            .btn-voltar {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #333;
        color: #fff;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        }

    .btn-voltar:hover {
        background: #555;
        }
    </style>
</head>
<body>
    <a href="/index.html" class="btn-voltar">Voltar</a>
    <div class="container">
        <h1>💰 Adicionar Gasto</h1>
        
        <!-- Form para adicionar gastos -->
        <form id="form">
            <label for="categoria">Categoria</label>
            <input id="categoria" type="text" placeholder="Ex: Alimentação" required>

            <label for="valor">Valor</label>
            <input id="valor" type="number" step="0.01" placeholder="Ex: 50.00" required>

            <button type="submit">Adicionar gasto</button>
        </form>

        <p id="msg"></p>
    </div>

    <a href="/">Voltar</a>

    <script>
        document.getElementById("form").addEventListener("submit", function (e) {
            e.preventDefault();   

            const categoria = document.getElementById("categoria").value;
            const valor = document.getElementById("valor").value;

            const data = { categoria, valor };

            fetch("/salvar-gasto", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(res => {
                const msgElement = document.getElementById("msg");
                msgElement.textContent = res.mensagem;
                msgElement.className = "show success";
                
                // Limpa o formulário
                document.getElementById("form").reset();
                
                // Remove a mensagem após 3 segundos
                setTimeout(() => {
                    msgElement.className = "";
                }, 3000);
                
                console.log("Resposta do servidor:", res);
            })
            .catch(err => {
                const msgElement = document.getElementById("msg");
                msgElement.textContent = "Erro ao salvar gasto. Tente novamente.";
                msgElement.className = "show error";
                console.error("Erro:", err);
            });
        });
    </script>
</body>
</html>
