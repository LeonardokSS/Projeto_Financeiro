<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Financeiro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            margin: 40px auto;
        }

        a {
            text-decoration: none;
            padding: 15px;
            background: #333;
            color: white;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }

        a:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <h1>Controle Financeiro</h1>

    <div class="menu">
        <a href="/salvar-gasto">Adicionar Gasto</a>
        <a href="/ver-gastos">Ver Gastos</a>
        <a href="/grafico">Gerar Gráfico</a>
        <a href="/sobre">Sobre o Sistema</a>
    </div>

</body>
</html>
