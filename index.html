<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello World</h1>
    <p>Check the console for JavaScript output.</p>

    <td>
        <tr>Preencha seu salario:  <input type="text" id="salario"></tr>
        <br><br>
        <tr>Preencha a soma de seus gastos fixos:  <input type="text"id="gastosF"></tr>
        <br><br>
        <tr>Preencha seus gastos não fixos:  <input type="text" id="gastosN"></tr>
        <br><br>
        <button type="button"id="botao">Calcular valor restante</button>
        <br><br>
        <P id="resultado"></P>
    </td>
</body>
<script src="script.js"></script>
<script>
document.getElementById('botao').addEventListener('click',function(){  
    const salario =parseFloat(document.getElementById("salario").value)
    const gastosFixos = parseFloat(document.getElementById("gastosF").value)
    const gastosNFixos = parseFloat(document.getElementById("gastosN").value)
    
    const final = salario - gastosFixos - gastosNFixos

    document.getElementById('resultado').textContent = final

});
</script>
</html>
